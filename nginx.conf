events {
    worker_connections 1024;
}

http {
    # WebSocket connection helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================
    # SERVER VARIABLES
    # ==========================
    upstream frontend_server {
        server 127.0.0.1:3001;
    }

    upstream backend_server {
        server 10.218.20.165:8081;
    }

    # ==========================
    # HTTP -> HTTPS
    # ==========================
    server {
        listen 80;
        server_name homepage.youngone.com.vn;

        return 301 https://$host$request_uri;
    }

    # ==========================
    # HTTPS 443
    # ==========================
    server {
        listen 443 ssl;
        server_name homepage.youngone.com.vn;

        ssl_certificate     /etc/nginx/ssl/homepage.youngone.com.vn.crt;
        ssl_certificate_key /etc/nginx/ssl/homepage.youngone.com.vn.key;

        # Frontend
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_server/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Upload files
        location /uploads/ {
            proxy_pass http://backend_server/uploads/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static files
        location /files/ {
            proxy_pass http://backend_server/files/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend_server/ws/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}